<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a252f"/>
      <stop offset="100%" stop-color="#0f171e"/>
    </linearGradient>
    <linearGradient id="wheatAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="50%" stop-color="#fda085"/>
      <stop offset="100%" stop-color="#d48842"/>
    </linearGradient>
    <linearGradient id="wheatHighGrade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#e17055"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Tray / Inspection Surface -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="560" height="360" rx="12" fill="#222f3e" stroke="#34495e" stroke-width="2"/>
  
  <!-- Optical Camera Grid Reticle Overlay -->
  <g stroke="rgba(46, 204, 113, 0.25)" stroke-width="1" stroke-dasharray="4 4">
    <line x1="20" y1="140" x2="580" y2="140"/>
    <line x1="20" y1="260" x2="580" y2="260"/>
    <line x1="200" y1="20" x2="200" y2="380"/>
    <line x1="400" y1="20" x2="400" y2="380"/>
  </g>

  <!-- Title / Sensor Banner -->
  <rect x="40" y="35" width="520" height="35" rx="6" fill="#1b2a47" stroke="#2980b9" stroke-width="1"/>
  <text x="55" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ecf0f1">
    CAMERA VISION INSPECTION: KS-BATCH-1001 • WHEAT (LOKWAN)
  </text>
  <text x="470" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#2ecc71">
    ● SENSOR READY
  </text>

  <!-- Wheat Grains Array on Inspection Tray -->
  <g transform="translate(60, 90)">
    <!-- Grain 1 (Central Plump) -->
    <ellipse cx="140" cy="110" rx="36" ry="18" fill="url(#wheatAmber)" stroke="#b36d24" stroke-width="1.5" transform="rotate(-25 140 110)"/>
    <line x1="110" y1="110" x2="170" y2="110" stroke="#8d4912" stroke-width="1.2" transform="rotate(-25 140 110)"/>

    <!-- Grain 2 (Top Left) -->
    <ellipse cx="80" cy="60" rx="34" ry="17" fill="url(#wheatHighGrade)" stroke="#b36d24" stroke-width="1.5" transform="rotate(35 80 60)"/>
    <line x1="52" y1="60" x2="108" y2="60" stroke="#8d4912" stroke-width="1.2" transform="rotate(35 80 60)"/>

    <!-- Grain 3 (Top Center) -->
    <ellipse cx="230" cy="70" rx="38" ry="19" fill="url(#wheatAmber)" stroke="#b36d24" stroke-width="1.5" transform="rotate(-10 230 70)"/>
    <line x1="198" y1="70" x2="262" y2="70" stroke="#8d4912" stroke-width="1.2" transform="rotate(-10 230 70)"/>

    <!-- Grain 4 (Right) -->
    <ellipse cx="320" cy="120" rx="35" ry="18" fill="url(#wheatHighGrade)" stroke="#b36d24" stroke-width="1.5" transform="rotate(45 320 120)"/>
    <line x1="290" y1="120" x2="350" y2="120" stroke="#8d4912" stroke-width="1.2" transform="rotate(45 320 120)"/>

    <!-- Grain 5 (Bottom Left) -->
    <ellipse cx="110" cy="180" rx="37" ry="18" fill="url(#wheatAmber)" stroke="#b36d24" stroke-width="1.5" transform="rotate(15 110 180)"/>
    <line x1="78" y1="180" x2="142" y2="180" stroke="#8d4912" stroke-width="1.2" transform="rotate(15 110 180)"/>

    <!-- Grain 6 (Bottom Center) -->
    <ellipse cx="220" cy="170" rx="36" ry="18" fill="url(#wheatHighGrade)" stroke="#b36d24" stroke-width="1.5" transform="rotate(-30 220 170)"/>
    <line x1="188" y1="170" x2="252" y2="170" stroke="#8d4912" stroke-width="1.2" transform="rotate(-30 220 170)"/>

    <!-- Grain 7 (Far Right) -->
    <ellipse cx="390" cy="80" rx="34" ry="17" fill="url(#wheatAmber)" stroke="#b36d24" stroke-width="1.5" transform="rotate(-15 390 80)"/>
    <line x1="360" y1="80" x2="420" y2="80" stroke="#8d4912" stroke-width="1.2" transform="rotate(-15 390 80)"/>

    <!-- Grain 8 (Far Bottom Right) -->
    <ellipse cx="370" cy="175" rx="36" ry="18" fill="url(#wheatHighGrade)" stroke="#b36d24" stroke-width="1.5" transform="rotate(20 370 175)"/>
    <line x1="338" y1="175" x2="402" y2="175" stroke="#8d4912" stroke-width="1.2" transform="rotate(20 370 175)"/>
  </g>

  <!-- Bounding Box Targeting Reticle -->
  <rect x="180" y="170" width="130" height="90" rx="4" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="180" y="152" width="85" height="18" rx="2" fill="#e74c3c"/>
  <text x="185" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">
    DETECTION: 98%
  </text>

  <!-- Live Optical Telemetry Readout -->
  <rect x="40" y="325" width="520" height="40" rx="6" fill="#1e272e" stroke="#2f3640" stroke-width="1"/>
  <text x="55" y="348" font-family="monospace" font-size="11" fill="#2ed573">
    RES: 1920x1080 | COLOR: Amber Gold (Vitreous) | UNIFORMITY: 94.6% | DEFECT RATIO: 1.4%
  </text>
</svg>

